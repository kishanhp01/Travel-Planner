<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Travel Planner Pro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <nav class="top-nav app-nav">
      <a class="brand" href="dashboard.html">Travel Planner Pro</a>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-trip.html">Create trip</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
      </div>
    </nav>

    <main class="content-shell">
      <section class="card profile-card">
        <h1>Your profile</h1>
        <p>Fine-tune your travel preferences and save your favorite details.</p>
        <form id="profile-form">
          <label>
            Name
            <input type="text" id="profile-name" />
          </label>
          <label>
            Preferred destination type
            <input type="text" id="profile-preference" />
          </label>
          <label>
            Travel style
            <input type="text" id="profile-style" />
          </label>
          <button class="btn primary" type="submit">Save preferences</button>
        </form>
      </section>
    </main>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
